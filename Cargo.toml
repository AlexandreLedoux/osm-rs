[package]
name = "map"
version = "0.1.0"
edition = "2024"

[dependencies]
osmpbf = "0.3.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
macroquad = "0.4"
clap = { version = "4", features = ["derive"] }
earcutr = "0.5"
redb = "4.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
